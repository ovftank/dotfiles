# CÀI ĐẶT CHUNG

# Bật kéo cửa sổ tiling bằng chuột
tiling_drag modifier titlebar

# GIAO DIỆN
# Font và size
font pango:JetBrainsMono Nerd Font, monospace 10

# Viền và kích cỡ cửa sổ
for_window [class="^.*"] border pixel 3
for_window [class="^.*"] move position center

# Kích cỡ floating windows
for_window [title="Open File"] resize set 800 600
for_window [title="Open Folder"] resize set 800 600
for_window [title="Save File"] resize set 800 600

# Khoảng cách mặc định giữa các cửa sổ
gaps inner 15
gaps outer 15

# KHỞI ĐỘNG
# Khởi chạy ibus-daemon để gõ tiếng Việt
exec --no-startup-id exec ibus-daemon -drxR

# Hình nền
exec --no-startup-id exec feh --bg-scale ~/.config/i3/wallpaper/*.jpg

# Khởi chạy thanh Polybar
exec --no-startup-id exec polybar

# Khởi động trình quản lí âm thanh
exec --no-startup-id exec pulseaudio --kill&&pulseaudio --start