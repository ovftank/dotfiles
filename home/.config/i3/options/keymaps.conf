mode "resize" {
        bindsym $mod+e mode "default"
        bindsym Escape mode "default"
        bindsym Return mode "default"

        bindsym h resize shrink width 10 px or 10 ppt
        bindsym j resize grow height 10 px or 10 ppt
        bindsym k resize shrink height 10 px or 10 ppt
        bindsym l resize grow width 10 px or 10 ppt
}

bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4

bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4

bindsym $mod+Shift+e exec "i3-msg exit"
bindsym $mod+Shift+r exec "i3-msg restart"

bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+s exec "maim -s -u | xclip -selection clipboard -t image/png -i"
bindsym Print exec "maim -u | xclip -selection clipboard -t image/png -i"
bindsym $mod+Shift+x scratchpad show floating toggle
bindsym $mod+Tab floating toggle
bindsym $mod+b exec "killall -q polybar; polybar"
bindsym $mod+f exec "rofi -show drun"
bindsym $mod+t exec "i3-sensible-terminal"
bindsym $mod+x move scratchpad
bindsym $mod+space exec "sh ~/.config/polybar/scripts/ibus/ibus-toggle.sh"

bindsym $mod+equal gaps outer current minus 5
bindsym $mod+minus gaps outer current plus 5

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym F11 fullscreen toggle
bindsym Mod1+F4 kill
bindsym Mod1+Tab exec --no-startup-id rofi -modi combi -combi-modi window -show combi

floating_modifier $mod
