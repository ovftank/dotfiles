[colors]
background = #282A36
background-alt = #44475A
foreground = #F8F8F2
primary = #F8F8F2
secondary = #8BE9FD
alert = #FF5555
disabled = #6272A4

[bar/example]
width = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=12

modules-left = xworkspaces xwindow
modules-center = date coding-time
modules-right = ram-usage cpu-usage pulseaudio wifi-status battery-status ibus-status

cursor-click = pointer

enable-ipc = true
wm-restack = i3

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:35:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix-foreground = ${colors.primary}
format-volume = <ramp-volume> <label-volume>

label-volume = %percentage%%

label-muted =   0%
label-muted-foreground = ${colors.disabled}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1

date =  %H:%M
date-alt =  %d/%m/%Y - %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/ibus-status]
type = custom/script
exec = ~/.config/polybar/scripts/ibus/ibus-status.sh
interval = 0.1
click-left = ~/.config/polybar/scripts/ibus/ibus-toggle.sh

[module/ram-usage]
type = custom/script
exec = ~/.config/polybar/scripts/system/ram-usage.sh
interval = 2

[module/cpu-usage]
type = custom/script
exec = ~/.config/polybar/scripts/system/cpu-usage.sh
interval = 2

[module/battery-status]
type = custom/script
exec = ~/.config/polybar/scripts/system/battery-status.sh
interval = 2

[module/wifi-status]
type = custom/script
exec = ~/.config/polybar/scripts/wifi/wifi-status.sh
interval = 0
label-foreground = ${colors.foreground}
click-left = ~/.config/polybar/scripts/wifi/wifi-toggle.sh
click-middle = nm-connection-editor
click-right = ~/.config/polybar/scripts/wifi/connect-wifi.sh


[module/coding-time]
type = custom/script
exec = ~/.config/polybar/scripts/coding-time/wakatime.sh
interval = 1
click-left = xdg-open https://wakatime.com/@tripleseven190504

[settings]
screenchange-reload = true
pseudo-transparency = true