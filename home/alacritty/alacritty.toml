# Dracula colors palette
[colors.bright]
black = "0x282a35"
blue = "0xcaa9fa"
cyan = "0x9aedfe"
green = "0x5af78e"
magenta = "0xff92d0"
red = "0xff6e67"
white = "0xe6e6e6"
yellow = "0xf4f99d"

[colors.normal]
black = "0x000000"
blue = "0xcaa9fa"
cyan = "0x8be9fd"
green = "0x50fa7b"
magenta = "0xff79c6"
red = "0xff5555"
white = "0xbfbfbf"
yellow = "0xf1fa8c"

[colors.primary]
background = "0x282a36"
foreground = "0xf8f8f2"

# Cursor settings

[cursor]
blink_interval = 500
thickness = 0.15
unfocused_hollow = true

[cursor.style]
blinking = "Always"
shape = "Beam"

# Font setting

[font]
size = 12.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

# Disable default keybindings
[[keyboard.bindings]]
action = "None"
key = "B"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "D"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Down"

[[keyboard.bindings]]
action = "None"
key = "G"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "H"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "I"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Left"

[[keyboard.bindings]]
action = "None"
key = "M"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "N"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "O"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "P"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Right"

[[keyboard.bindings]]
action = "None"
key = "S"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Space"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "None"
key = "T"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Up"

[[keyboard.bindings]]
action = "None"
key = "W"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "X"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "Y"
mods = "Control"

[[keyboard.bindings]]
action = "None"
key = "/"
mods = "Control"

# Copy paste
[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mode = "~Vi"
mods = "Control"

[[mouse.bindings]]
action = "Paste"
mouse = "Right"

# Map move like vim
[[keyboard.bindings]]
chars = "\u001B[D"
key = "H"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[B"
key = "J"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[A"
key = "K"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001B[C"
key = "L"
mods = "Alt"

# Move forward and backward faster
[[keyboard.bindings]]
action = "First"
key = "Q"
mode = "Vi|~Search"
mods = "Control"

[[keyboard.bindings]]
action = "Last"
key = "E"
mode = "Vi|~Search"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001BB"
key = "H"
mods = "Control|Alt"

[[keyboard.bindings]]
chars = "\u001BF"
key = "L"
mods = "Control|Alt"

# Stop execution
[[keyboard.bindings]]
chars = "\u0003"
key = "C"
mods = "Control|Shift"

# Delete word left
[[keyboard.bindings]]
key = "Backspace"
mods = "Shift"
chars = "\u0017"


[selection]
save_to_clipboard = true

[shell]
args = ["--login"]
program = "zsh"

[window]
dynamic_title = false
opacity = 0.9
title = "Terminal"
