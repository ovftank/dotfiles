set -g @thm_bg        "#282A36"
set -g @thm_bg_status "#21222C"
set -g @thm_chip      "#343746"
set -g @thm_chip2     "#44475A"
set -g @thm_fg        "#F8F8F2"
set -g @thm_fg_dim    "#6272A4"
set -g @thm_accent    "#BD93F9"
set -g @thm_accent2   "#8BE9FD"
set -g @thm_warn      "#FFB86C"
set -g @thm_alert     "#FF5555"

set -g status-style "bg=#{@thm_bg_status},fg=#{@thm_fg_dim}"

set -g status-left-length 1
set -g status-left ""

set -g status-right-length 120
set -g status-right "#{?#{e|>=:#{client_width},100},#[fg=#{@thm_fg_dim}] #{=/-45/…:pane_current_path} ,#{?#{e|>=:#{client_width},70},#[fg=#{@thm_fg_dim}] #{b:pane_current_path} ,}}#[bg=#{@thm_chip2} fg=#{@thm_fg}] %H:%M "

set -g  window-status-separator ""

setw -g window-status-format \
  "#{?window_start_flag,#[fg=#{@thm_fg_dim} bg=#{@thm_bg_status}],#[fg=#{@thm_fg_dim} bg=#{@thm_chip}]}▐#[bg=#{@thm_fg_dim} fg=#{@thm_bg} bold] #I #[fg=#{@thm_chip} bg=#{@thm_fg_dim}]▐#[bg=#{@thm_chip} fg=#{@thm_fg} nobold] #W #{?window_end_flag,#[fg=#{@thm_bg_status} bg=#{@thm_chip}]▐#[bg=#{@thm_bg_status}],}"

setw -g window-status-current-format \
  "#{?window_start_flag,#[fg=#{@thm_accent} bg=#{@thm_bg_status}],#[fg=#{@thm_accent} bg=#{@thm_chip}]}▐#[bg=#{@thm_accent} fg=#{@thm_bg} bold] #I #[fg=#{@thm_chip} bg=#{@thm_accent}]▐#[bg=#{@thm_chip} fg=#{@thm_fg} bold] #W #{?window_end_flag,#[fg=#{@thm_bg_status} bg=#{@thm_chip}]▐#[bg=#{@thm_bg_status}],}"

setw -g window-status-activity-style "fg=#{@thm_warn},bold"
setw -g window-status-bell-style     "fg=#{@thm_alert},bold"

set -g pane-border-style        "fg=#{@thm_chip2}"
set -g pane-active-border-style "fg=#{@thm_accent},bold"
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status off

set -g message-style         "bg=#{@thm_chip2},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_chip2},fg=#{@thm_accent2}"
set -g mode-style            "bg=#{@thm_accent},fg=#{@thm_bg},bold"
set -g popup-style           "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g popup-border-style    "fg=#{@thm_chip2}"
set -g menu-style            "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g menu-selected-style   "bg=#{@thm_accent},fg=#{@thm_bg},bold"
set -g menu-border-style     "fg=#{@thm_chip2}"

set -gF clock-mode-colour           "#{@thm_accent}"
set -gF display-panes-colour        "#{@thm_chip2}"
set -gF display-panes-active-colour "#{@thm_accent}"
set -g  clock-mode-style 24
