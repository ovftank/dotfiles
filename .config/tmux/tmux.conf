bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
bind -n C-BTab previous-window
bind -n C-Tab next-window
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-w if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys C-w' \
  'kill-window'
bind -n DoubleClick1Pane select-pane -t= \; send -M
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n MouseDrag1Pane send -M
bind -n TripleClick1Pane select-pane -t= \; send -M
bind -n WheelDownPane send -M
bind -n WheelUpPane send -M
set -g allow-passthrough on
set -g base-index 1
set -g bell-action none
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g history-limit 50000
set -g monitor-activity off
set -g monitor-bell off
set -g mouse on
set -g prefix None
set -g prefix2 None
set -g renumber-windows on
set -g set-clipboard on
set -g status-interval 5
set -g status-justify left
set -g status-position top
set -g visual-activity off
set -g visual-bell off
set -su terminal-features
set -sa terminal-features 'xterm-kitty:extkeys:hyperlinks:osc7:RGB'
setenv -g PI_CLIPBOARD_OSC52 1
setw -g mode-keys vi
source-file ~/.config/tmux/themes/dracula.conf
