# Mode
Mode="Uinput (Smooth)"
# Input Method
InputMethod=Telex
# Output Charset
OutputCharset=Unicode
# Mode Menu Hotkey
ModeMenuKey=
# Cycle Mode Hotkey
CycleModeKey=
# Type w to Produce ư
W2U=Disabled
# Type [ -> ơ, ] -> ư, { -> Ơ, } -> Ư
BracketTransform=Disabled
# Enable Spell Check Using Dictionary
SpellCheck=False
# Enable Macro
EnableMacro=False
# Capitalize Macro
CapitalizeMacro=False
# Modifier to Skip Macro for Next Word
MacroSkipTriggerModifier=Disabled
# Auto capitalize after sentence-ending punctuation (. ! ? Enter)
AutoCapitalizeAfterPunctuation=False
# Double Space to Period
DoubleSpaceToPeriod=False
# Double Hyphen to Em-Dash (--)
DoubleHyphenToEmDash=False
# Auto Restore Invalid Words
AutoNonVnRestore=False
# Use oà, uý (Instead Of òa, úy)
ModernStyle=True
# Allow Type With More Freedom
FreeMarking=True
# Allow dd To Produce đ When Auto Restore Invalid Words Is On
DdFreeStyle=False
# Use Lotus Status Icons
UseLotusIcons=False
# Custom Dictionary
EnableDictionary=False
# Custom Keymap
EnableCustomKeymap=False
# Show Uinput (Smooth)
ShowModeSmooth=False
# Shortcut for Uinput (Smooth)
ShortcutSmooth=1
# Show Uinput (Super Smooth)
ShowModeSuperSmooth=False
# Shortcut for Uinput (Super Smooth)
ShortcutSuperSmooth=a
# Show Uinput (Select)
ShowModeSelect=False
# Shortcut for Uinput (Select)
ShortcutSelect=2
# Show Surrounding Text
ShowModeSurroundingText=False
# Shortcut for Surrounding Text
ShortcutSurroundingText=4
# Show Preedit
ShowModePreedit=False
# Shortcut for Preedit
ShortcutPreedit=q
# Show Emoji Picker
ShowModeEmoji=False
# Shortcut for Emoji Picker
ShortcutEmoji=w
# Show OFF
ShowModeOff=False
# Shortcut for OFF
ShortcutOff=e
# Show Default Typing
ShowModeDefault=False
# Shortcut for Default Typing
ShortcutDefault=r
# Allow Macro in Off Mode
EnableMacroInOffMode=False
# Default Commit Interval (ms)
DefaultCommitInterval=20
# Default Backspace Interval (ms)
DefaultBackspaceInterval=5
# Default Post Delay (ms)
DefaultPostDelay=10
# Mode Order
ModeOrder=Smooth,Select,SurroundingText,Preedit,Emoji,Off,SuperSmooth,Default
# Time Format ($TIME in macro)
TimeFormat=%H:%M
# Date Format ($DATE in macro)
DateFormat=%d/%m/%Y
# Icon Color
IconTheme=Auto

